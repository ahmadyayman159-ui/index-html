<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية الدلتا للعلوم والتكنولوجيا - Ahmady Ayman Ahmady</title>
    <!-- Bootstrap 5 CSS (RTL) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/rtl.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light py-4">

    <div class="container">
        <!-- رأس الصفحة بتصميم أكاديمي احترافي -->
        <header class="text-center mb-5 p-4 bg-white shadow-sm rounded-4 border-start border-primary border-5">
            <div class="container">
                <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill mb-2 fw-bold">أكاديمية الدلتا للعلوم والتكنولوجيا</span>
                <h1 class="fw-bold text-dark display-6 mb-1">نظام إدارة النتائج وتفعيل لجنة الرأفة</h1>
                <p class="text-muted mb-0">إعداد الطالب: <span class="text-primary fw-semibold">Ahmady Ayman Ahmady</span> | مهارات نظم ومعلومات</p>
            </div>
        </header>

        <div class="row g-4">
            <!-- عمود إدخال البيانات -->
            <div class="col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">تسجيل طالب جديد</h5>
                    </div>
                    <div class="card-body">
                        <!-- صندوق عرض رسائل الخطأ -->
                        <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

                        <form id="studentForm">
                            <!-- اسم الطالب -->
                            <div class="mb-3">
                                <label for="studentName" class="form-label">اسم الطالب</label>
                                <input type="text" class="form-control" id="studentName" placeholder="أدخل اسم الطالب ثلاثي">
                            </div>

                            <!-- درجات المواد الثلاث -->
                            <div class="mb-3">
                                <label for="grade1" class="form-label">درجة المادة الأولى (0 - 100)</label>
                                <input type="number" class="form-control" id="grade1" placeholder="أدخل الدرجة">
                            </div>
                            <div class="mb-3">
                                <label for="grade2" class="form-label">درجة المادة الثانية (0 - 100)</label>
                                <input type="number" class="form-control" id="grade2" placeholder="أدخل الدرجة">
                            </div>
                            <div class="mb-3">
                                <label for="grade3" class="form-label">درجة المادة الثالثة (0 - 100)</label>
                                <input type="number" class="form-control" id="grade3" placeholder="أدخل الدرجة">
                            </div>

                            <!-- نسبة الحضور -->
                            <div class="mb-3">
                                <label for="attendance" class="form-label">نسبة الحضور (%)</label>
                                <input type="number" class="form-control" id="attendance" placeholder="أدخل النسبة">
                            </div>

                            <!-- أزرار التحكم -->
                            <div class="d-grid gap-2">
                                <button type="button" id="addBtn" class="btn btn-success">إضافة طالب</button>
                                <button type="button" id="mercyBtn" class="btn btn-warning text-dark fw-bold">تفعيل لجنة الرأفة</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- عمود عرض النتائج والتقارير -->
            <div class="col-lg-7">
                <!-- صندوق قائمة الطلاب المضافين -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">قائمة الطلاب المسجلين</h5>
                    </div>
                    <div class="card-body">
                        <div id="studentsListBox" class="list-group">
                            <p class="text-muted text-center mb-0">لا توجد بيانات طلاب مسجلة حتى الآن.</p>
                        </div>
                    </div>
                </div>

                <!-- صندوق التقرير النهائي للجنة الرأفة -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">التقرير النهائي للجنة الرأفة</h5>
                    </div>
                    <div class="card-body">
                        <div id="mercyReportBox">
                            <p class="text-muted text-center mb-0">لم يتم تفعيل لجنة الرأفة بعد.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>
